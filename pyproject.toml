[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoexo"
version = "0.1.0"
description = "EgoExo-Fitness 微调：动作质量分(有序回归) + 可解释关键点验证(GEV)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
